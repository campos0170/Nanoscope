name: Beta bug report
description: Report a reproducible NanoScope problem without uploading confidential recordings.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing NanoScope. Please redact personal paths and experimental identifiers
        from logs. Do not attach a recording unless its owner has explicitly approved sharing it.
  - type: input
    id: version
    attributes:
      label: NanoScope version or commit
      description: Use the release tag, commit SHA, or About/build information.
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Include macOS version and Mac model/chip.
      placeholder: macOS 15.x, Apple M2
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Recording format
      options:
        - ABF
        - HDF5
        - TDMS
        - CSV or TXT
        - No recording involved
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest reliable sequence of actions.
      placeholder: |
        1. Open …
        2. Select …
        3. Run …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact error or unexpected output.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove personal paths, sample identifiers, and confidential data first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not attached a confidential recording or unredacted experimental data.
          required: true
