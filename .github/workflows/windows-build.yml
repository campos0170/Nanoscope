name: Windows build

# Builds NanoScope.exe on GitHub's Windows machines (PyInstaller cannot build a Windows app from a
# Mac), runs the Windows tests and the bundle self-test, and keeps the ZIP as a run artifact.
#
# The ZIP is attached to a GitHub release only when a release is published, or when this workflow
# is run by hand with a release tag: Actions -> Windows build -> Run workflow -> release_tag.
# A tag build checks out that tag, so the ZIP is built from the same commit as the release's DMG.
#
# Job logs need a signed-in GitHub account to read. Test and build failures are therefore also
# written as annotations, which the public API returns without one.

on:
  push:
    paths:
      - ".github/workflows/windows-build.yml"
      - ".github/scripts/**"
      - "packaging/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and attach the ZIP to, for example v45.55.44. Leave empty to build this branch without attaching anything."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}-${{ github.event.release.tag_name || inputs.release_tag || 'branch' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The release being built, or empty for a branch build.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: src
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - name: Check out the source (the release tag, when building one)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: src
      - name: Check out this workflow's helper scripts
        uses: actions/checkout@v6
        with:
          path: ci
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/pyproject.toml
            src/packaging/environments/macos-arm64-py311-validated.constraints.txt
      - name: Install the validated release dependencies
        run: |
          # The macOS release pins, minus the ones that do not carry over to Windows: pytest 7.4
          # and its plugins (".[dev]" asks for pytest 8), and tensorflow-io-gcs-filesystem 0.37.1,
          # which has no Windows wheel (pip picks 0.31.0, which satisfies TensorFlow's >=0.23.1).
          $constraints = Join-Path $env:RUNNER_TEMP "windows-constraints.txt"
          Get-Content packaging/environments/macos-arm64-py311-validated.constraints.txt |
            Where-Object { $_ -notmatch '^(pytest|pluggy|iniconfig|tensorflow-io-gcs-filesystem)==' } |
            Set-Content $constraints
          python -m pip install --upgrade pip
          python -m pip install -c $constraints -e ".[dev]" tensorflow keras
      - name: Run core, I/O, packaging and recovery tests
        env:
          NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}\nanoscope-recovery
        run: |
          python -m pytest -q -p no:cacheprovider -m "not corpus" `
            --junitxml (Join-Path $env:RUNNER_TEMP "windows-tests.xml") `
            tests/core tests/io tests/packaging `
            tests/gui/test_recovery_controller.py `
            tests/gui/test_project_recovery.py
      - name: Report test failures as annotations
        if: always()
        run: python ../ci/.github/scripts/junit_to_annotations.py (Join-Path $env:RUNNER_TEMP "windows-tests.xml") "Windows tests"

  build:
    name: Build NanoScope.exe
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: src
    steps:
      - name: Check out the source (the release tag, when building one)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/pyproject.toml
            src/packaging/environments/macos-arm64-py311-validated.constraints.txt
      - name: Install the validated release dependencies and PyInstaller
        run: |
          # Same pins as the test job; PyInstaller matches the macOS release build.
          $constraints = Join-Path $env:RUNNER_TEMP "windows-constraints.txt"
          Get-Content packaging/environments/macos-arm64-py311-validated.constraints.txt |
            Where-Object { $_ -notmatch '^(pytest|pluggy|iniconfig|tensorflow-io-gcs-filesystem)==' } |
            Set-Content $constraints
          python -m pip install --upgrade pip
          python -m pip install -c $constraints -e ".[dev]" tensorflow keras `
            "pyinstaller==6.21.0" "pyinstaller-hooks-contrib==2026.6"
          python -m pip freeze --exclude-editable > (Join-Path $env:RUNNER_TEMP "windows-resolved.txt")
      - name: Build with packaging/build_app.ps1
        run: |
          # A release tag can predate the fix to build_app.ps1's self-test, which did not wait for
          # the exe, so tag builds skip it and rely on the self-test step below.
          $buildArgs = @()
          if ($env:RELEASE_TAG) { $buildArgs += "-SkipSelfTest" }
          pwsh -NoProfile -File packaging/build_app.ps1 @buildArgs 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "build.log")
          exit $LASTEXITCODE
      - name: Self-test the built exe
        timeout-minutes: 15
        run: |
          # NanoScope.exe is a windowed program: Start-Process -Wait is what waits for it, and the
          # redirects are the only way to see what it prints.
          $out = Join-Path $env:RUNNER_TEMP "selftest.out.txt"
          $err = Join-Path $env:RUNNER_TEMP "selftest.err.txt"
          $exe = (Resolve-Path "dist\NanoScope\NanoScope.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err -ErrorAction SilentlyContinue
          "self-test exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }
      - name: Report a build or self-test failure as annotations
        if: failure()
        run: |
          function Escape([string]$text) { $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A") }
          $out = Join-Path $env:RUNNER_TEMP "selftest.out.txt"
          if (Test-Path $out) {
            $lines = Get-Content $out | Where-Object { $_ -match "\[FAIL\]|checks passed|BAD ARGUMENTS|Traceback|Error" }
            if (-not $lines) { $lines = Get-Content $out -Tail 40 }
            Write-Output ("::error title=Windows self-test::" + (Escape ($lines -join "`n")))
          }
          $err = Join-Path $env:RUNNER_TEMP "selftest.err.txt"
          if ((Test-Path $err) -and (Get-Item $err).Length -gt 0) {
            Write-Output ("::error title=Windows self-test stderr::" + (Escape ((Get-Content $err -Tail 40) -join "`n")))
          }
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          if (Test-Path $log) {
            Write-Output ("::error title=Windows build log (last 60 lines)::" + (Escape ((Get-Content $log -Tail 60) -join "`n")))
          }
      - name: Keep the ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NanoScope-windows
          path: src/dist/NanoScope-*-win64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Keep the build record and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-record
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/selftest.out.txt
            ${{ runner.temp }}/selftest.err.txt
            ${{ runner.temp }}/windows-resolved.txt
            src/build/release-metadata/_build_info.json
          if-no-files-found: ignore
          retention-days: 30

  attach:
    name: Attach the ZIP to the release
    needs: [test, build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NanoScope-windows
          path: built
      - name: Upload the ZIP and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built=(built/NanoScope-*-win64.zip)
          [ "${#built[@]}" -eq 1 ] || { echo "expected one ZIP, found ${#built[@]}" >&2; exit 1; }
          # Named after the release tag, like the DMG: v45.55.44 -> NanoScope-45.55.44-win64.zip.
          asset="NanoScope-${RELEASE_TAG#v}-win64.zip"
          mv "${built[0]}" "$asset"
          # Add the ZIP to the release's SHA256SUMS.txt, replacing an older line for the same name.
          mkdir -p sums
          if gh release download "$RELEASE_TAG" --repo "$REPO" --pattern SHA256SUMS.txt --dir sums; then
            grep -v "  ${asset}\$" sums/SHA256SUMS.txt > SHA256SUMS.txt || true
          else
            : > SHA256SUMS.txt
          fi
          sha256sum "$asset" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$asset" SHA256SUMS.txt --repo "$REPO" --clobber
