name: Windows build

# Builds NanoScope.exe on GitHub's Windows machines (PyInstaller cannot build a Windows app from a
# Mac), runs the Windows tests and the bundle self-test, and keeps the ZIP as a run artifact.
#
# The ZIP is attached to a GitHub release only:
#   * when a release is published (the build is of the release's own tag), or
#   * when this workflow is run by hand with a release tag: Actions -> Windows build ->
#     Run workflow -> release_tag. That builds the branch it is run from, and refuses unless the
#     branch's app code (nanoscope/ and pyproject.toml) is identical to the tag's, so the ZIP
#     carries the same app as the release's DMG. Packaging may differ: that is how a release made
#     before a Windows packaging fix still gets a working Windows build.
#
# Job logs need a signed-in GitHub account to read. Test and build failures are therefore also
# written as annotations, which the public API returns without one.

on:
  push:
    # App changes alone do not start a run (they reach Windows at the next release); changes
    # to the Windows packaging, this workflow or the tests it runs do.
    paths:
      - ".github/workflows/windows-build.yml"
      - ".github/scripts/**"
      - "packaging/**"
      - "tests/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the ZIP to, for example v45.55.44. Leave empty to build without attaching anything."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}-${{ github.event.release.tag_name || inputs.release_tag || 'branch' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The release the ZIP is for, or empty for a plain build.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      # The built NanoScope.exe runs in Python's UTF-8 mode (NanoScope-win.spec), so the tests
      # do too; otherwise they would test cp1252 text handling the app never uses.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/environments/macos-arm64-py311-validated.constraints.txt
      - name: Install the validated release dependencies
        run: |
          # The macOS release pins, minus the ones that do not carry over to Windows: pytest 7.4
          # and its plugins (".[dev]" asks for pytest 8), and tensorflow-io-gcs-filesystem 0.37.1,
          # which has no Windows wheel (pip picks 0.31.0, which satisfies TensorFlow's >=0.23.1).
          $constraints = Join-Path $env:RUNNER_TEMP "windows-constraints.txt"
          Get-Content packaging/environments/macos-arm64-py311-validated.constraints.txt |
            Where-Object { $_ -notmatch '^(pytest|pluggy|iniconfig|tensorflow-io-gcs-filesystem)==' } |
            Set-Content $constraints
          python -m pip install --upgrade pip
          python -m pip install -c $constraints -e ".[dev]" tensorflow keras
      - name: Run core, I/O, packaging and recovery tests
        env:
          NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}\nanoscope-recovery
        run: |
          # Twice this job ran into its time limit with no report, so the tests run under
          # run_tests_resumably.py: pytest gets its own hidden console and output files, a test
          # that stops making progress for 5 minutes is killed and recorded (with the stack dump
          # faulthandler_timeout writes at 4 minutes), a test that ends pytest is recorded, and
          # the run carries on after either. results.xml covers every test.
          python .github/scripts/run_tests_resumably.py `
            --out-dir (Join-Path $env:RUNNER_TEMP "windows-tests") `
            --idle-minutes 5 --time-limit-minutes 70 `
            pytest -q -p no:cacheprovider -m "not corpus" -o faulthandler_timeout=240 `
            tests/core tests/io tests/packaging `
            tests/gui/test_recovery_controller.py tests/gui/test_project_recovery.py 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "windows-tests.log")
          exit $LASTEXITCODE
      - name: Report test results as annotations
        if: always()
        run: |
          python .github/scripts/junit_to_annotations.py `
            (Join-Path $env:RUNNER_TEMP "windows-tests\results.xml") "Windows tests" `
            --log (Join-Path $env:RUNNER_TEMP "windows-tests.log")
      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-record
          path: |
            ${{ runner.temp }}/windows-tests.log
            ${{ runner.temp }}/windows-tests/*.txt
            ${{ runner.temp }}/windows-tests/results.xml
            ${{ runner.temp }}/windows-tests/state/events.jsonl
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build NanoScope.exe
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Check this commit has the release's app code
        if: env.RELEASE_TAG != ''
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { throw "Release tag $($env:RELEASE_TAG) was not found on GitHub" }
          $changed = git diff --name-only "$($env:RELEASE_TAG)" HEAD -- nanoscope pyproject.toml
          if ($LASTEXITCODE -ne 0) { throw "Could not compare this commit with $($env:RELEASE_TAG)" }
          if ($changed) {
            $list = ($changed -join "%0A")
            Write-Output "::error title=App code differs from $($env:RELEASE_TAG)::This commit's app code is not the release's, so its ZIP would not match the DMG. Changed:%0A$list"
            exit 1
          }
          "App code (nanoscope/, pyproject.toml) is identical to $($env:RELEASE_TAG)."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/environments/macos-arm64-py311-validated.constraints.txt
      - name: Install the validated release dependencies and PyInstaller
        run: |
          # Same pins as the test job; PyInstaller matches the macOS release build.
          $constraints = Join-Path $env:RUNNER_TEMP "windows-constraints.txt"
          Get-Content packaging/environments/macos-arm64-py311-validated.constraints.txt |
            Where-Object { $_ -notmatch '^(pytest|pluggy|iniconfig|tensorflow-io-gcs-filesystem)==' } |
            Set-Content $constraints
          python -m pip install --upgrade pip
          python -m pip install -c $constraints -e ".[dev]" tensorflow keras `
            "pyinstaller==6.21.0" "pyinstaller-hooks-contrib==2026.6"
          python -m pip freeze --exclude-editable > (Join-Path $env:RUNNER_TEMP "windows-resolved.txt")
      - name: Build, self-test and zip with packaging/build_app.ps1
        run: |
          pwsh -NoProfile -File packaging/build_app.ps1 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "build.log")
          exit $LASTEXITCODE
      - name: Report a build or self-test failure as annotations
        if: failure()
        run: |
          function Escape([string]$text) { $text.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A") }
          if (Test-Path "build\selftest.out.txt") {
            $lines = Get-Content "build\selftest.out.txt" | Where-Object { $_ -match "\[FAIL\]|checks passed|BAD ARGUMENTS" }
            if (-not $lines) { $lines = Get-Content "build\selftest.out.txt" -Tail 40 }
            Write-Output ("::error title=Windows self-test::" + (Escape ($lines -join "`n")))
          }
          if ((Test-Path "build\selftest.err.txt") -and (Get-Item "build\selftest.err.txt").Length -gt 0) {
            Write-Output ("::error title=Windows self-test stderr::" + (Escape ((Get-Content "build\selftest.err.txt" -Tail 40) -join "`n")))
          }
          $log = Join-Path $env:RUNNER_TEMP "build.log"
          if (Test-Path $log) {
            Write-Output ("::error title=Windows build log (last 60 lines)::" + (Escape ((Get-Content $log -Tail 60) -join "`n")))
          }
      - name: Keep the ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NanoScope-windows
          path: dist/NanoScope-*-win64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Keep the build record and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-record
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/windows-resolved.txt
            build/selftest.out.txt
            build/selftest.err.txt
            build/release-metadata/_build_info.json
          if-no-files-found: ignore
          retention-days: 30

  attach:
    name: Attach the ZIP to the release
    needs: [test, build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NanoScope-windows
          path: built
      - name: Upload the ZIP and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built=(built/NanoScope-*-win64.zip)
          [ "${#built[@]}" -eq 1 ] || { echo "expected one ZIP, found ${#built[@]}" >&2; exit 1; }
          # Named after the release tag, like the DMG: v45.55.44 -> NanoScope-45.55.44-win64.zip.
          asset="NanoScope-${RELEASE_TAG#v}-win64.zip"
          mv "${built[0]}" "$asset"
          # Add the ZIP to the release's SHA256SUMS.txt, replacing an older line for the same name.
          mkdir -p sums
          if gh release download "$RELEASE_TAG" --repo "$REPO" --pattern SHA256SUMS.txt --dir sums; then
            grep -v "  ${asset}\$" sums/SHA256SUMS.txt > SHA256SUMS.txt || true
          else
            : > SHA256SUMS.txt
          fi
          sha256sum "$asset" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$asset" SHA256SUMS.txt --repo "$REPO" --clobber
