name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core-and-recovery:
    name: Core and recovery checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}/nanoscope-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NanoScope and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run core, I/O, packaging, and recovery tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not corpus"
          tests/core tests/io tests/packaging
          tests/gui/test_recovery_controller.py
          tests/gui/test_project_recovery.py

  full-regression:
    name: Full regression (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: analysis
            tests: tests/analysis
          - shard: gui
            tests: tests/gui
          - shard: remaining
            tests: tests/plot tests/lifetime tests/test_*.py
    env:
      NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}/nanoscope-recovery-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NanoScope and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run ${{ matrix.shard }} tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not corpus"
          ${{ matrix.tests }}
