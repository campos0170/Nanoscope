name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  core-and-recovery:
    name: Core and recovery checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}/nanoscope-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NanoScope and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run core, I/O, packaging, and recovery tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not corpus"
          tests/core tests/io tests/packaging
          tests/gui/test_recovery_controller.py
          tests/gui/test_project_recovery.py

  full-regression:
    name: Full regression (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: analysis
            tests: tests/analysis
          # tests/gui is split into 16 shards, not run as one process (2026-09-13).
          # Root cause: a destroyed Qt wrapper (PySide6 6.11.1 and 6.11.2, both
          # confirmed) becomes permanently invisible to Python's own cycle
          # collector -- gc.collect() cannot free it even called explicitly, which
          # is a separate problem from this suite's gc.disable() policy below (that
          # guards against a live-wrapper-destruction deadlock; re-enabling it would
          # not free these dead-wrapper zombies either). Measured: each MainWindow
          # construct/destroy cycle leaks ~734 zombie QObjects and ~3.6 MB RSS,
          # linearly, with no plateau across 40 cycles in one process. A single
          # ~1,000-test gui process run accumulates enough of these to plausibly
          # explain the intermittent SIGSEGV inside PySide::SignalManager::
          # retrieveMetaObject seen in long GUI runs (always late, always during
          # construction of an unrelated class -- consistent with a process-wide,
          # ever-growing internal registry). Splitting into ~20-file shards cuts
          # peak per-process accumulation ~16x; a controlled comparison (same
          # 8-file/159-test combination, combined vs. split into per-file
          # processes) crashed 1/15 combined vs. 0/15 split -- suggestive, not by
          # itself definitive, but consistent with the deterministic scaling
          # measurement. This does not fix the underlying PySide6 issue and does
          # not eliminate the crash risk; it bounds it. gui_shard is "index/total"
          # into an alphabetically sorted, interleaved split of tests/gui/test_*.py
          # computed live below, so it never goes stale as files are added/removed.
          - shard: gui-01
            gui_shard: "0/16"
          - shard: gui-02
            gui_shard: "1/16"
          - shard: gui-03
            gui_shard: "2/16"
          - shard: gui-04
            gui_shard: "3/16"
          - shard: gui-05
            gui_shard: "4/16"
          - shard: gui-06
            gui_shard: "5/16"
          - shard: gui-07
            gui_shard: "6/16"
          - shard: gui-08
            gui_shard: "7/16"
          - shard: gui-09
            gui_shard: "8/16"
          - shard: gui-10
            gui_shard: "9/16"
          - shard: gui-11
            gui_shard: "10/16"
          - shard: gui-12
            gui_shard: "11/16"
          - shard: gui-13
            gui_shard: "12/16"
          - shard: gui-14
            gui_shard: "13/16"
          - shard: gui-15
            gui_shard: "14/16"
          - shard: gui-16
            gui_shard: "15/16"
          - shard: remaining
            tests: tests/plot tests/lifetime tests/test_*.py
    env:
      NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}/nanoscope-recovery-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NanoScope and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Resolve this shard's test paths
        id: files
        run: |
          if [ -n "${{ matrix.gui_shard }}" ]; then
            python - "${{ matrix.gui_shard }}" <<'PYEOF'
          import os, pathlib, sys
          idx, total = (int(x) for x in sys.argv[1].split("/"))
          files = sorted(p.as_posix() for p in pathlib.Path("tests/gui").glob("test_*.py"))
          selected = files[idx::total]
          if not selected:
              sys.exit(f"gui shard {idx}/{total} selected zero files out of {len(files)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("paths=" + " ".join(selected) + "\n")
          PYEOF
          else
            echo "paths=${{ matrix.tests }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ${{ matrix.shard }} tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not corpus"
          ${{ steps.files.outputs.paths }}

  scientific-smoke:
    name: Scientific behavior and reference-workflow checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NANOSCOPE_RECOVERY_ROOT: ${{ runner.temp }}/nanoscope-scientific-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NanoScope and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Preserve resolved dependency inventory
        run: python -m pip list --format=json > ci-resolved-dependencies.json
      - name: Run curated scientific and opt-in workflow regressions
        # Historical platform-specific byte oracles remain in the full manual
        # analysis shard. No expected scientific hashes are rewritten here.
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not corpus"
          tests/analysis/test_detect.py
          tests/analysis/test_detect_cusum.py
          tests/analysis/test_filters.py
          tests/analysis/test_event_amplitude.py
          tests/analysis/test_event_amplitude_lifecycle.py
          tests/analysis/test_dual_signal_classical_detection.py
          tests/analysis/test_open_pore_reference.py
          tests/analysis/test_open_pore_reference_integration.py
          tests/analysis/test_preview_capture.py
          tests/analysis/test_reference_recipe_hardening.py
          tests/analysis/test_filter_replay_hardening.py
          tests/analysis/test_reference_restore_error_contract.py
          tests/gui/test_open_pore_reference_panel.py
          tests/gui/test_open_pore_reference_workflow.py
          tests/gui/test_reference_recipe_restore_safety.py
          tests/gui/test_inspector_filter_replay_safety.py
          tests/gui/test_background_levels_and_lazy_batch.py
          tests/gui/test_display_residual_cache.py
          tests/gui/test_release_onboarding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-smoke-resolved-dependencies
          path: ci-resolved-dependencies.json
